name: Test Release (TestPyPI)

# Manual dry run of the release pipeline: builds the frontend, builds the
# package, and publishes to test.pypi.org instead of the real index. Run this
# from the Actions tab as many times as needed to rehearse the publish step
# before ever pushing a real version tag. See release.yml for the real path.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: static-assets
          path: src/agentstage/static

  build:
    name: Build distribution
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: static-assets
          path: src/agentstage/static

      - name: Give this build a unique, disposable version
        # TestPyPI rejects re-uploading an existing version, same as real
        # PyPI. Suffixing with the run number lets this workflow run
        # repeatedly without ever touching the committed version number.
        run: |
          DEV_VERSION="$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2).dev${{ github.run_number }}"
          sed -i "s/^version = \".*\"/version = \"$DEV_VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$DEV_VERSION\"/" src/agentstage/__init__.py
          echo "Building version $DEV_VERSION"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: test-dist
          path: dist/

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/agentstage-ui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
